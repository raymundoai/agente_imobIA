# ImmobIA em produção (Easypanel → serviço "Compose", apontando para este arquivo).
#
# Domínios (configurados no Easypanel, porta 80 de cada serviço):
#   web   → painel da imobiliária (ex.: app.immobia.com.br)
#   admin → painel admin           (ex.: admin.immobia.com.br)
# O backend não tem porta pública: tudo chega por /api nos dois painéis.
# As variáveis vêm do .env deste diretório (modelo em .env.production.example).

x-backend: &backend
  build:
    context: ../backend
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PROPERTY_MEDIA_ROOT: /data/property-images
    CONVERSATION_MEDIA_ROOT: /data/conversation-media
    # Only the two nginx front ends can reach the backend, so their address is trusted.
    FORWARDED_ALLOW_IPS: "*"
  volumes:
    - property_media:/data/property-images
    - conversation_media:/data/conversation-media
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Sends the agent's replies to WhatsApp. Without it, nobody gets an answer.
  message-worker:
    <<: *backend
    command: ["python", "-m", "app.modules.messaging.worker"]
    depends_on:
      backend:
        condition: service_healthy

  # Runs the property searches on the portals.
  capture-worker:
    <<: *backend
    command: ["python", "-m", "app.modules.capture.worker"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        APP: agency
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ../frontend
      args:
        APP: platform
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Daily copy of the database and the media, kept for BACKUP_KEEP_DAYS days.
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/scripts/backup.sh"]
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - backups:/backups
      - property_media:/data/property-images:ro
      - conversation_media:/data/conversation-media:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  property_media:
  conversation_media:
  backups:
